name: Publicar Aprende Facil PRO
on:
  push:
    branches: [main]
    paths:
      - 'AprendeFacilPRO_PACK20_4_WEB_PUBLICAR.zip'

permissions:
  contents: write
  pages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener Biblioteca
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validar el ZIP y preparar solo Aprende Facil
        run: python3 .github/scripts/publicar_aprende_facil.py

      - name: Registrar los contenidos y la ficha
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- aprende-facil aprende-facil.html aprende-facil-portada.webp catalogo.json AprendeFacilPRO_PACK20_4_WEB_PUBLICAR.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Publicar Aprende Fácil PRO 20.4 en la Biblioteca'
          git push origin HEAD:main

      - name: Solicitar nueva compilacion de GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -sS -o /tmp/pages-resultado.json -w '%{http_code}' -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          echo "Respuesta de Pages: ${CODE}"
          if [ "${CODE}" != '201' ]; then
            echo '::warning::El contenido se ha guardado, pero Pages no confirmó la compilación automática.'
            cat /tmp/pages-resultado.json
          fi
