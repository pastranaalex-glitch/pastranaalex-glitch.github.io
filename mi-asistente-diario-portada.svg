<title id="title">Mi Asistente Diario: presentación de la aplicación</title>
<desc id="desc">Dos teléfonos Android tridimensionales con el panel de tiempo, citas, medicación y controles de salud de Mi Asistente Diario sobre un escritorio luminoso.</desc>
<defs>
