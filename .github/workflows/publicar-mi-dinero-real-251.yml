name: Publicar Mi Dinero Real 2.5.1
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions puede retrasar la tarea; el programa nunca adelanta la fecha.
    - cron: '29 */6 * * *'
    # 21/10/2026 00:00 Madrid equivale a 20/10/2026 22:00 UTC.
    - cron: '*/15 22-23 20 10 *'
    - cron: '*/15 0-12 21 10 *'
permissions:
  contents: write
concurrency:
  group: mi-dinero-real-251
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar APK firmada, autorización y fecha
        run: python3 .github/scripts/publicar_mi_dinero_real_251.py
      - name: Activar catálogo y ficha solo después de la fecha
        run: |
          git add -- catalogo.json mi-dinero-real.html proximamente.html index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Estreno pendiente o ya completado"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Estrenar Mi Dinero Real 2.5.1 en fecha autorizada [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
