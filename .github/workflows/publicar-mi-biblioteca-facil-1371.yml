name: Mi Biblioteca Fácil 1.37.1 - publicar APK verificada

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-mi-biblioteca-facil-1371.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: mi-biblioteca-facil-publicar-1371
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name == 'push' || github.event.release.tag_name == 'mi-biblioteca-facil-v1.37.1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener la Biblioteca
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Descargar la APK de la publicación oficial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .apk-verificacion
          gh release download 'mi-biblioteca-facil-v1.37.1' \
            --repo "${{ github.repository }}" \
            --pattern 'MiBibliotecaFacil_1.37.1_PUBLICA.apk.zip' \
            --dir .apk-verificacion \
            --clobber
          archivo='.apk-verificacion/MiBibliotecaFacil_1.37.1_PUBLICA.apk.zip'
          test -f "$archivo"
          test "$(stat -c%s "$archivo")" -eq 28177024
          echo '74af334ce3790647bcdf935cbae700031f229e4f0d84d6dc6c2dc6f5d9e5101e  .apk-verificacion/MiBibliotecaFacil_1.37.1_PUBLICA.apk.zip' | sha256sum -c
          # Aunque se subió con extensión .apk.zip, los bytes son un APK Android.
          python3 - "$archivo" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              names = set(apk.namelist())
              assert "AndroidManifest.xml" in names
              assert "classes.dex" in names
          PY
          mkdir -p biblioteca-app/apk
          cp "$archivo" 'biblioteca-app/apk/MiBibliotecaFacil_1.37.1_PUBLICA.apk'
          rm -rf .apk-verificacion
      - name: Publicar asset APK con su nombre correcto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          etiqueta='mi-biblioteca-facil-v1.37.1'
          archivo='biblioteca-app/apk/MiBibliotecaFacil_1.37.1_PUBLICA.apk'
          if ! gh release view "$etiqueta" --repo "${{ github.repository }}" --json assets -q '.assets[].name' | grep -Fxq 'MiBibliotecaFacil_1.37.1_PUBLICA.apk'; then
            gh release upload "$etiqueta" "$archivo" --repo "${{ github.repository }}"
          fi
          # Evitar que usuarios descarguen la copia mal nombrada por error.
          if gh release view "$etiqueta" --repo "${{ github.repository }}" --json assets -q '.assets[].name' | grep -Fxq 'MiBibliotecaFacil_1.37.1_PUBLICA.apk.zip'; then
            gh release delete-asset "$etiqueta" 'MiBibliotecaFacil_1.37.1_PUBLICA.apk.zip' --repo "${{ github.repository }}" --yes
          fi
      - name: Activar la ficha y el canal de actualizaciones
        run: |
          set -euo pipefail
          python3 scripts/publicar_mi_biblioteca_facil_1371.py
      - name: Publicar cambios en main
        run: |
          set -euo pipefail
          git add -- biblioteca-app/apk/MiBibliotecaFacil_1.37.1_PUBLICA.apk \
            biblioteca-app/actualizacion-release.json \
            catalogo.json proximas-apps.json \
            pack6.js proximamente.html mi-biblioteca-facil.html sitemap.xml
          if git diff --cached --quiet; then
            echo "La versión ya estaba publicada."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publicar Mi Biblioteca Fácil 1.37.1 verificada [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Solicitar actualización de GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds" >/dev/null || \
            echo "GitHub Pages revisará el contenido publicado en main."
