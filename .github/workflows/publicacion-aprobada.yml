name: Biblioteca - Publicación automática aprobada

on:
  push:
    branches: [main]
    paths:
      - 'proximas-apps.json'
      - 'scripts/publicar_aprobadas.py'
  release:
    types: [published, edited]
  schedule:
    # GitHub Actions puede ejecutar la tarea con cierto retraso.
    - cron: '29 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biblioteca-publicacion-aprobada
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revisar anuncios y versiones autorizadas
        run: python scripts/publicar_aprobadas.py
      - name: Guardar nuevas fichas publicadas
        run: |
          git add -- catalogo.json sitemap.xml
          for file in mi-salud-familiar.html mi-dinero-real.html menu-y-compra.html jardin-de-joyas.html; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No hay aplicaciones nuevas aprobadas"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publicar aplicaciones aprobadas [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

