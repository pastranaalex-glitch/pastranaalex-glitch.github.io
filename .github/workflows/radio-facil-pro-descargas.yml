name: Contador de descargas - Radio Facil PRO

on:
  workflow_dispatch:
  # También se ejecuta al editar este archivo para generar el primer contador.
  schedule:
    - cron: '19 */6 * * *'
  release:
    types: [published]
  push:
    paths:
      - '.github/workflows/radio-facil-pro-descargas.yml'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Consultar descargas reales de GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          pattern = re.compile(r"^RadioFacilPRO_[0-9].*\.apk$", re.I)
          avoid = re.compile(r"debug|unsigned|sin[._-]?firmar", re.I)
          total = 0
          assets_found = 0
          latest_count = None
          seen = set()
          completed = False
          for page in range(1, 11):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "radio-facil-pro-public-counter"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  releases = json.load(response)
              if not isinstance(releases, list):
                  raise RuntimeError("GitHub no devolvio una lista de lanzamientos")
              for release in releases:
                  if release.get("draft"):
                      continue
                  for asset in release.get("assets", []):
                      name = asset.get("name", "")
                      if (asset.get("state") != "uploaded" or
                          not pattern.match(name) or avoid.search(name)):
                          continue
                      key = asset.get("id")
                      if key in seen:
                          continue
                      seen.add(key)
                      n = asset.get("download_count")
                      if not isinstance(n, int) or n < 0:
                          raise RuntimeError(f"Contador invalido para {name}")
                      total += n
                      assets_found += 1
                      if name == "RadioFacilPRO_1.22.0_FIRMADA.3.apk" and release.get("tag_name") == "radio-facil-pro-v1.22.0":
                          latest_count = n
              if len(releases) < 100:
                  completed = True
                  break
          if not completed:
              raise RuntimeError("No se consultaron todos los lanzamientos")
          if assets_found == 0:
              raise RuntimeError("No se encontro ninguna APK de Radio Facil PRO. No publicar cero no verificado.")
          body = {
              "aplicacion": "radio-facil-pro",
              "fuente": "GitHub Releases",
              "actualizado": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "total_descargas": total,
              "archivos_contabilizados": assets_found,
              "version_actual": "1.22.0",
              "descargas_version_actual": latest_count,
              "nota": "Descargas de archivos APK publicadas; no instalaciones ni usuarios unicos."
          }
          with open("radio-facil-pro-descargas.json", "w", encoding="utf-8") as f:
              json.dump(body, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"Radio Facil PRO: {total} descargas en {assets_found} APK.")
          PY
      - name: Publicar estadisticas en GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio-facil-pro-descargas.json
          if git diff --cached --quiet; then
            echo "No hay cambios."
            exit 0
          fi
          git commit -m "Actualizar contador real de descargas Radio Facil PRO [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
