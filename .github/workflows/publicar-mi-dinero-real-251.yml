name: Publicar Mi Dinero Real 2.5.1
# Publicacion temporalmente bloqueada por decision del autor.
# Sin eventos cron ni ejecucion manual; requiere una nueva aprobacion expresa.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-mi-dinero-real-251.yml'
permissions:
  contents: write
concurrency:
  group: mi-dinero-real-251
  cancel-in-progress: false
jobs:
  publicar:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar APK firmada, autorización y fecha
        run: python3 .github/scripts/publicar_mi_dinero_real_251.py
      - name: Activar catálogo y ficha solo después de la fecha
        run: |
          git add -- catalogo.json mi-dinero-real.html proximamente.html index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Estreno pendiente o ya completado"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Estrenar Mi Dinero Real 2.5.1 en fecha autorizada [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
