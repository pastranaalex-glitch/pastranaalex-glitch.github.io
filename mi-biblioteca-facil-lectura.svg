" height="510" rx="7" fill="url(#paper)" /><text x="183" y="302" fill="#3e4540" font-family="Arial, sans-serif" font-size="26" font-weight="700" >Un pequeño viaje</text><text x="183" y="337" fill="#3e4540" font-family="Arial, sans-serif" font-size="26" font-weight="700" >entre páginas</text><text x="183" y="383" fill="#56594d" font-family="Arial, sans-serif" font-size="17" font-weight="400" >Una mañana, al abrir el libro,</text><text x="183" y="414" fill="#56594d" font-family="Arial, sans-serif" font-size="17" font-weight="400" >descubrió que cada historia</text><text x="183" y="445" fill="#56594d" font-family="Arial, sans-serif" font-size="17" font-weight="400" >guarda una puerta distinta.</text><text x="183" y="494" fill="#56594d" font-family="Arial, sans-serif" font-size="17" font-weight="400" >A veces basta una página</text><text x="183" y="525" fill="#56594d" font-family="Arial, sans-serif" font-size="17" font-weight="400" >para empezar un viaje que</text><text x="183" y="556" fill="#56594d" font-family="Arial, sans-serif" font-size="17" font-weight="400" >no esperábamos encontrar.</text><text x="183" y="667" fill="#8a887d" font-family="Arial, sans-serif" font-size="16" font-weight="400" >12 de 148 páginas</text><rect x="185" y="681" width="307" height="5" rx="2" fill="#d3d4c6" /><rect x="185" y="681" width="74" height="5" rx="2" fill="#2a8794" /><text x="153" y="790" fill="#345d68" font-family="Arial, sans-serif" font-size="22" font-weight="700" >A−</text><text x="315" y="790" fill="#345d68" font-family="Arial, sans-serif" font-size="23" font-weight="700" >Aa</text><text x="467" y="790" fill="#345d68" font-family="Arial, sans-serif" font-size="22" font-weight="700" >A+</text></svg>