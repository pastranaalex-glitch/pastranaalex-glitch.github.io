name: Biblioteca - Publicación automática aprobada

on:
  push:
    branches: [main]
    paths:
      - 'proximas-apps.json'
      - 'scripts/publicar_aprobadas.py'
      - 'scripts/publicar_jardin_186.py'
      - 'tests/test_publicacion_jardin.py'
      - '.github/workflows/publicacion-aprobada.yml'
  release:
    types: [published, edited]
  schedule:
    # GitHub Actions puede ejecutar la tarea con cierto retraso.
    - cron: '29 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: biblioteca-publicacion-aprobada
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revisar anuncios y versiones autorizadas
        run: python scripts/publicar_aprobadas.py
      - name: Comprobar publicación de Jardín de Joyas
        run: python -m unittest discover -s tests -p 'test_publicacion_jardin.py' -v
      - name: Activar Jardín de Joyas solo tras verificar la APK pública
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publicar_jardin_186.py
      - name: Guardar nuevas fichas publicadas
        id: cambios
        run: |
          git add -- catalogo.json sitemap.xml index.html proximas-apps.json
          for file in mi-salud-familiar.html mi-dinero-real.html menu-y-compra.html jardin-de-joyas.html; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No hay publicaciones pendientes verificadas"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publicar aplicaciones aprobadas [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "publicado=true" >> "$GITHUB_OUTPUT"
      - name: Actualizar GitHub Pages
        if: steps.cambios.outputs.publicado == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" > /dev/null


